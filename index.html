<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        /* Базовый минимализм Apple */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #111; padding: 40px; border-radius: 20px; width: 100%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, select, button { width: 100%; margin-bottom: 15px; padding: 15px; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
        input, select { background: #222; color: #fff; }
        button { background: #e60000; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #cc0000; }
        .hidden-honeypot { display: none !important; }
        #successMessage { display: none; text-align: center; color: #4caf50; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <form id="registrationForm">
        <input type="text" name="botField" id="botField" class="hidden-honeypot" tabindex="-1" autocomplete="off">

        <input type="text" id="name" placeholder="Ваше имя" required>
        <input type="tel" id="phone" placeholder="Номер телефона" required>
        
        <select id="platform" required>
            <option value="" id="optDefault" disabled selected>Выберите платформу...</option>
            <option value="Bolt">Bolt</option>
            <option value="Uber">Uber</option>
            <option value="Glovo">Glovo</option>
        </select>

        <button type="submit" id="submitBtn">ОСТАВИТЬ ЗАЯВКУ</button>
    </form>

    <div id="successMessage">
        ✓ Заявка успешно отправлена!
    </div>
</div>

<script>
    // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhsVBmrPVqf9mDGifqT45B1KJ3D34Ob4mhlZkuF1ImNNLoJ7ANSAnhGFz0fXahhQE/exec';

    // --- СИСТЕМА ЛОКАЛИЗАЦИИ ---
    const translations = {
        ru: {
            title: "Регистрация",
            namePlace: "Ваше имя",
            phonePlace: "Номер телефона",
            selectDefault: "Выберите платформу...",
            btnSubmit: "ОСТАВИТЬ ЗАЯВКУ",
            btnSending: "ОТПРАВКА...",
            successText: "✓ Заявка успешно отправлена!",
            errSubmit: "Произошла ошибка при отправке. Попробуйте еще раз.",
            errNet: "Проблема с подключением. Проверьте интернет."
        },
        pl: {
            title: "Rejestracja",
            namePlace: "Twoje imię",
            phonePlace: "Numer telefonu",
            selectDefault: "Wybierz platformę...",
            btnSubmit: "ZŁÓŻ WNIOSEK",
            btnSending: "WYSYŁANIE...",
            successText: "✓ Wniosek został pomyślnie wysłany!",
            errSubmit: "Wystąpił błąd podczas wysyłania. Spróbuj ponownie.",
            errNet: "Problem z połączeniem. Sprawdź internet."
        }
    };

    // Определяем язык браузера (берем первые 2 буквы, например 'ru' из 'ru-RU')
    let userLang = (navigator.language || navigator.userLanguage).substring(0, 2).toLowerCase();
    
    // Если язык не польский, по умолчанию ставим русский
    if (userLang !== 'pl') {
        userLang = 'ru';
    }

    const t = translations[userLang];

    // Применяем переводы к элементам страницы при загрузке
    document.title = t.title;
    document.getElementById('name').placeholder = t.namePlace;
    document.getElementById('phone').placeholder = t.phonePlace;
    document.getElementById('optDefault').innerText = t.selectDefault;
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = t.btnSubmit;
    document.getElementById('successMessage').innerText = t.successText;
    // ----------------------------

    const form = document.getElementById('registrationForm');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            platform: document.getElementById('platform').value,
            botField: document.getElementById('botField').value
        };

        // Используем переведенный текст для состояния загрузки
        submitBtn.innerText = t.btnSending;
        submitBtn.disabled = true;

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if(data.result === "success") {
                form.style.display = 'none';
                successMessage.style.display = 'block';
            } else {
                alert(t.errSubmit);
                submitBtn.innerText = t.btnSubmit;
                submitBtn.disabled = false;
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
            alert(t.errNet);
            submitBtn.innerText = t.btnSubmit;
            submitBtn.disabled = false;
        });
    });
</script>

</body>
</html>
